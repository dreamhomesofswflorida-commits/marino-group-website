<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Your course | Marino Group</title>
<link rel="icon" href="/img/marino_logo_transparent_gold.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Figtree:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#141312;color:#f3ece0;font:17px/1.6 "Figtree","Segoe UI",Arial,sans-serif}
main{max-width:1040px;margin:0 auto;padding:28px 20px 60px}
.eyebrow{font:500 13px "Jost",Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#d8c3a0}
h1{font:400 clamp(28px,4.5vw,44px)/1.1 "Jost",Arial,sans-serif;margin:10px 0 8px}
p{color:#bdb3a3;margin:0 0 14px}a{color:#d8c3a0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.lang{display:flex;border:1px solid #36322d;border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:#bdb3a3;font:600 15px "Figtree",sans-serif;padding:10px 18px;cursor:pointer}
.lang button.on{background:#d8c3a0;color:#141312}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:22px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
video{width:100%;border-radius:14px;background:#000;aspect-ratio:16/9}
.now{font:500 20px "Jost",sans-serif;margin:12px 0 0}
.list{display:flex;flex-direction:column;gap:8px}
.list button{display:flex;gap:12px;align-items:center;text-align:left;background:#1d1b19;border:1px solid #36322d;color:#f3ece0;border-radius:12px;padding:12px 14px;font:500 15px "Figtree",sans-serif;cursor:pointer}
.list button.on{border-color:#d8c3a0}
.list .n{flex:none;width:30px;height:30px;border-radius:50%;background:#d8c3a0;color:#141312;display:grid;place-items:center;font-weight:600}
.list .done .n{background:#5e8c5a;color:#fff}
.bonus{margin-top:22px}.bonus a{display:block;background:#1d1b19;border:1px solid #36322d;border-radius:12px;padding:12px 14px;margin-top:8px;text-decoration:none}
.msg{max-width:560px;margin:12vh auto;text-align:center}
.small{font-size:13px;color:#8c8376;margin-top:30px}
</style>
</head>
<body>
<main id="app"><div class="msg"><span class="eyebrow">One moment</span><h1>Loading your course…</h1></div></main>
<script src="/js/config.js"></script>
<script>
const K=(window.MG_CONFIG||{}).SUPABASE_ANON_KEY;
const FN="https://ssbnylpqoxnzwxhsmomc.supabase.co/functions/v1/course-access";
const T={en:{title:"Buying Foreclosures & Tax Deeds in Collier County",hi:"Welcome! Your lessons",bonus:"Your downloads",save:"Bookmark this page now: it is your personal access link. Lost it? Text (239) 776-2393 with your purchase receipt.",names:["How the sales work","Finding the lists","Researching a property","Comps and your maximum bid","Registering and bidding","After you win"],lesson:"Lesson"},
 es:{title:"Ejecuciones Hipotecarias y Tax Deeds en el Condado de Collier",hi:"¡Bienvenido! Tus lecciones",bonus:"Tus descargas",save:"Guarda esta página ahora: es tu enlace personal de acceso. ¿Lo perdiste? Escribe al (239) 776-2393 con tu recibo de compra.",names:["Cómo funcionan las ventas","Encontrar las listas","Investigar una propiedad","Comparables y tu oferta máxima","Registro y ofertas","Después de ganar"],lesson:"Lección"}};
const app=document.getElementById("app"), qs=new URLSearchParams(location.search), sid=qs.get("session_id"), kc=qs.get("k");
let D=null, lang=localStorage.getItem("mgCourseLang")||((navigator.language||"").startsWith("es")?"es":"en"), cur=0;
const seen=()=>{try{return JSON.parse(localStorage.getItem("mgSeen_"+lang)||"[]")}catch(e){return[]}};
function err(m){app.innerHTML=`<div class="msg"><span class="eyebrow">Course access</span><h1>${m}</h1><p>If you just paid, wait a minute and refresh. Still stuck? Call or text <a href="tel:+12397762393">(239) 776-2393</a> and we'll help right away.</p><p><a href="/course/">Back to the course page</a></p></div>`}
function render(){
 const t=T[lang], L=D[lang]; const s=seen();
 app.innerHTML=`<div class="top"><div><span class="eyebrow">${D.tier==="pro"?"Pro":"Starter"} · ${t.title}</span><h1>${t.hi}</h1><p>${t.save}</p></div>
 <div class="lang"><button data-l="en" class="${lang==="en"?"on":""}">English</button><button data-l="es" class="${lang==="es"?"on":""}">Español</button></div></div>
 <div class="grid"><div><video id="v" controls playsinline preload="metadata" src="${L.lessons[cur].url}"></video><div class="now">${t.lesson} ${cur+1}: ${t.names[cur]}</div></div>
 <div><div class="list">${L.lessons.map((x,i)=>`<button data-i="${i}" class="${i===cur?"on":""} ${s.includes(i)?"done":""}"><span class="n">${s.includes(i)?"✓":i+1}</span>${t.names[i]}</button>`).join("")}</div>
 <div class="bonus"><span class="eyebrow">${t.bonus}</span>${L.bonus.map(b=>`<a href="${b.url}" download>⬇ ${b.file.replace(/-/g," ").replace(/\.(pdf|xlsx)$/," ($1)")}</a>`).join("")}</div></div></div>
 <p class="small">Educational only. Not legal, tax or investment advice. Jorge Marino LLC · Jorge Marino, REALTOR® · Waterfront Realty Group, Inc.</p>`;
 app.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;localStorage.setItem("mgCourseLang",lang);render()});
 app.querySelectorAll(".list button").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render();document.getElementById("v").play().catch(()=>{})});
 document.getElementById("v").onended=()=>{const s2=seen();if(!s2.includes(cur)){s2.push(cur);localStorage.setItem("mgSeen_"+lang,JSON.stringify(s2))} if(cur<5){cur++;render();document.getElementById("v").play().catch(()=>{})} else render()};
}
(async()=>{
 if(!sid&&!kc) return err("Open the link from your purchase email to watch the course.");
 try{const r=await fetch(FN,{method:"POST",headers:{"Content-Type":"application/json",apikey:K,Authorization:"Bearer "+K},body:JSON.stringify({session_id:sid,k:kc})});
  const j=await r.json(); if(!r.ok) return err(j.error||"We couldn't open your course."); D=j; render();
  setTimeout(()=>location.reload(),5.5*3600*1000);
 }catch(e){err("We couldn't reach the course server.")}
})();
</script>
<script src="/js/app-back.js" defer></script>
</body>
</html>
